name: Code Review

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  code-review:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.issue.pull_request && startsWith(github.event.comment.body, '/review')) }}
    runs-on: ubuntu-latest
    steps:
      - name: Fetch PR Details
        id: pr_data
        run: |
          PR_JSON=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "${{ github.event.issue.pull_request.url }}")
          HEAD_REF=$(echo "$PR_JSON" | jq -r '.head.ref')
          echo "head_ref=$HEAD_REF" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v7
        with:
          ref: ${{ steps.pr_data.outputs.head_ref }}
          fetch-depth: 0

      - name: Configure Git identity
        run: |
          git config user.name "gemini-pr-agent[bot]"
          git config user.email "gemini-pr-agent[bot]@users.noreply.github.com"

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "25"

      - uses: rm-hull/pi-coding-agent-action@481c17aed6222627bad29248b0167642cf495fa5
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          provider: google
          model: gemini-3.5-flash-lite
          token: ${{ secrets.GEMINI_API_KEY }}
          prompt: |
            Review this pull request. Before starting, use get_issue_or_pr_thread to
            fetch any existing review comments so you don't duplicate feedback that
            has already been given. Focus on issues, bugs, and security concerns.
            Post your findings as a PR review when done.
          update_comment: true